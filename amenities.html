    <main id="pricingPage">
        <h2 class="fade-me">Plan Your Royal Stay</h2>

<form id="pricingForm" class="fade-me pricing-form">

            <!-- ROOM -->
            <fieldset>
                <legend>Select Your Room</legend>

                <label>
                    <input type="radio" name="room" value="249" required>
                    Royal Room ($249 per night)
                </label><br>

                <label>
                    <input type="radio" name="room" value="289">
                    El Dorado Room ($289 per night)
                </label>
            </fieldset>

            <!-- NIGHTS -->
            <fieldset>
                <legend>Length of Stay</legend>

                <label>
                    Number of Nights:
                    <input type="number" id="nights" min="1" value="1">
                </label>
            </fieldset>

            <!-- EXTRAS -->
            <fieldset>
                <legend>Optional Add-Ons</legend>

                <label>
                    <input type="checkbox" id="laundry">
                    In-House Laundry Service ($20 per stay)
                </label><br>

                <label>
                    <input type="checkbox" id="wine">
                    All Weekend Experience ($100 per stay)
                </label><br>

                <label>
                    <input type="checkbox" id="pets">
                    Honored Pets Welcome Package ($30 per stay)
                </label>
            </fieldset>

        </form>

        <!-- TOTAL -->
        <h3 class="fade-me">
            Estimated Total: <span id="total">$0.00</span>
        </h3>

    </main>
